apply plugin: 'com.android.library'

android {
    compileSdkVersion 31
    namespace 'uni.dcloud.io.uniplugin_module'
    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    // uniapp 基础依赖，只在插件编译时需要
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
//    compileOnly fileTree(dir: '../app/libs', include: ['uniapp-v8-release.aar'])

    // AndroidX 基础库（宿主 App 需要，改成 api）
    api 'androidx.recyclerview:recyclerview:1.0.0'
    api 'androidx.legacy:legacy-support-v4:1.0.0'
    api 'androidx.appcompat:appcompat:1.0.0'

    // 第三方库（宿主 App 需要，改成 api）
    api 'com.alibaba:fastjson:1.2.83'
    api 'com.facebook.fresco:fresco:1.13.0'

    // Google AdMob SDK（宿主 App 必须能访问，改成 api）
    api 'com.google.android.gms:play-services-ads:23.3.0'

    // Lifecycle（你的插件里用到，宿主也必须有，改成 api）
    api 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    api 'androidx.lifecycle:lifecycle-runtime:2.6.2'

    // Material Design（宿主需要，改成 api）
    api 'com.google.android.material:material:1.9.0'
}

